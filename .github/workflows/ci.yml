name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -v

  node-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: notification-service/package-lock.json
      - run: npm ci
      - run: npm run build
      # Vitest strips types rather than checking them, so this is the step
      # that actually type-checks src/ and test/.
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [go-test, node-test]
    steps:
      - uses: actions/checkout@v7
      - name: Run the saga simulation against the real stack
        run: bash scripts/simulate.sh
      - name: Show service logs
        if: always()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v
